# Each service gets its own Postgres — rule 2, one database per service.
# Services themselves arrive in later slices; this is the backing plane only.
services:
  directory-db:
    image: postgres:17
    environment:
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: directory
      POSTGRES_DB: directory
    ports:
      - "5433:5432"
    volumes:
      - directory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directory -d directory"]
      interval: 5s
      timeout: 3s
      retries: 10

  directory:
    build: ./services/directory
    environment:
      DIRECTORY_DATABASE_URL: postgresql://directory:directory@directory-db:5432/directory
      PORT: 3001
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3001:3001"
    depends_on:
      directory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  care-db:
    image: postgres:17
    environment:
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care
      POSTGRES_DB: care
    ports:
      - "5434:5432"
    volumes:
      - care-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care -d care"]
      interval: 5s
      timeout: 3s
      retries: 10

  care-records:
    build: ./services/care-records
    environment:
      # psycopg URL: Alembic (sync) and the app engine (async) both use it.
      CARE_DATABASE_URL: postgresql+psycopg://care:care@care-db:5432/care
      CARE_PORT: 3002
      CARE_KAFKA_BROKERS: kafka:9092
    ports:
      - "3002:3002"
    depends_on:
      care-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  directory-db-data:
  care-db-data:
  kafka-data:
